# Hrvatski prijevod stabla: samo imena, opisi i valuta. Brojevi i veze dolaze iz tree.properties.
currency=Dopamin

tyrosine.name=Tirozin
tyrosine.desc=Aminokiselina koja pluta u praiskonskoj juhi. Svaki nalet počinje ovdje.
ldopa.name=L-DOPA
ldopa.desc=Dodaj tirozinu jednu hidroksilnu skupinu. Sitna promjena s ogromnom budućnošću.
enzymes.name=Enzimi
enzymes.desc=Kemija se ubrzava. Kao i tvoji prsti.
dopamine.name=Dopamin
dopamine.desc=C8H11NO2. Rađa se molekula koja uvijek želi "još".
receptors.name=Receptori
receptors.desc=Stanice razvijaju pristaništa u koja se dopamin može uklopiti. Sada netko sluša.
signals.name=Kemijski signali
signals.desc=Pojedinačne stanice počinju razgovarati jedna s drugom pomoću molekula.
vesicles.name=Vezikule
vesicles.desc=Sićušni mjehurići čuvaju dopamin i otpuštaju ga odjednom. Prvi nalet.
neurons.name=Prvi neuroni
neurons.desc=Stanice specijalizirane za slanje signala. Počinje živčani sustav.
synapses.name=Sinapse
synapses.desc=Pukotina između neurona preko koje dopamin skače.
worm.name=Mozak crva
worm.desc=Sićušni crv sa samo osam dopaminskih neurona. Uspori kad pronađe hranu.
foodseeking.name=Traženje hrane
foodseeking.desc=Nađi hranu, osjećaj se dobro, ponovi. Prva petlja nagrade.
movement.name=Kretanje
movement.desc=Dopamin uči pokretati tijelo. Da bi nešto želio, trebaju ti noge.
reuptake.name=Ponovni unos
reuptake.desc=Pumpe vraćaju dopamin natrag. Svaki "high" mora završiti... zasad.
midbrain.name=Srednji mozak
midbrain.desc=VTA i substantia nigra. Dopamin dobiva svoje sjedište.
striatum.name=Strijatum
striatum.desc=Ovdje se biraju radnje i pohranjuju navike.
prediction.name=Pogreška predviđanja
prediction.desc=Bolje od očekivanog: skok. Lošije: pad. Točno kako je očekivano: baš ništa.
rewardpath.name=Put nagrade
rewardpath.desc=Mezolimbička autocesta, od VTA do nucleus accumbensa.
wanting.name=Željeti ili voljeti
wanting.desc=Dopamin nije užitak. To je svrbež da dobiješ još.
learning.name=Učenje nagradom
learning.desc=Svaka poslastica nečemu nauči. Svaka lekcija želi poslasticu.
novelty.name=Traženje novog
novelty.desc=Nove stvari sjaje jače. Znatiželja postaje sama sebi nagrada.
play.name=Igra
play.desc=Mladi sisavci se hrvaju i jure samo zato što je to ugodno.
bonding.name=Društvene veze
bonding.desc=Dodir, timarenje, ljubav. Drugi ljudi postaju nagrada.
hunt.name=Lov
hunt.desc=Potjera je bolja od samog obroka.
fire.name=Vatra i gozbe
fire.desc=Pečeno meso, zrelo voće, puni trbusi oko plamena.
exploration.name=Istraživanje
exploration.desc=Što je iza onog brda? Ljudi se šire po cijelom planetu.
music.name=Glazba
music.desc=Ritam i melodija tjeraju trnce niz kralježnicu. Nagrada od čistog zvuka.
stories.name=Priče
stories.desc=Izmišljen je napeti kraj poglavlja. "Samo još jedno poglavlje."
status.name=Status
status.desc=Biti obožavan postaje nagrada sama po sebi.
fermentation.name=Fermentacija
fermentation.desc=Voće istrune, netko ga popije i nitko to nikad ne zaboravi.
trade.name=Trgovina i novac
trade.desc=Nagrada koju možeš spremiti i brojati. Gledati kako brojke rastu je ugodno.
habit.name=Petlja navike
habit.desc=Okidač, rutina, nagrada. Ponavljaj dovoljno dugo i radi se sama od sebe.
tolerance.name=Tolerancija
tolerance.desc=Isti udarac svaki put djeluje slabije. Treba ti više.
craving.name=Žudnja
craving.desc=Mozak se pali već na okidač, prije nego što nagrada uopće stigne.
stimulants.name=Stimulansi
stimulants.desc=Kava, duhan, šećer. Cijeli trgovački putovi izgrađeni na dopaminu.
gambling.name=Kockanje
gambling.desc=Možda ovaj put. Neizvjesnost je najjača udica od svih.
withdrawal.name=Apstinencijska kriza
withdrawal.desc=Ispod početne razine. Normalan život počinje djelovati sivo.
addiction.name=Ovisnost
addiction.desc=Kad želja zgrabi volan i ne želi ga vratiti.
advertising.name=Oglašavanje
advertising.desc=Netko nauči kako prodati okidač.
slots.name=Automati
slots.desc=Promjenjive nagrade izgrađene u čeliku. Svjetla, zvukovi i "zamalo".
television.name=Televizija
television.desc=Svjetleća kutija kojoj nikad ne ponestane nečeg novog.
internet.name=Internet
internet.desc=Svaka ikad stvorena nagrada, na jedan klik.
videogames.name=Videoigre
videogames.desc=Razine, plijen i rekordi. Nagrade po rasporedu.
likes.name=Lajkovi
likes.desc=Automat u džepu koji isplaćuje odobravanje.
scroll.name=Beskonačno skrolanje
scroll.desc=Nema dna, pa nema ni znaka da staneš.
notifications.name=Obavijesti
notifications.desc=Ding. Možda te nešto čeka.
lootboxes.name=Kutije s plijenom
lootboxes.desc=Kockanje u kostimu.
shortvideo.name=Kratki videi
shortvideo.desc=Petnaest sekundi novog, zauvijek.
detox.name=Dopaminski detoks
detox.desc=Odložiš mobitel. Na neko vrijeme.
neuroscience.name=Neuroznanost
neuroscience.desc=Napokon razumijemo stroj. Razumjeti ga ne znači i isključiti ga.
idlegames.name=Idle igre
idlegames.desc=Brojke rastu dok ti ne radiš baš ništa. Zvuči poznato?
thisgame.name=Dopamin Rush
thisgame.desc=Upravo ga igraš. Kako se osjećaš?
final.name=Posljednji nalet
final.desc=Ovdje se događa nešto posebno...

catechol.name=Katehol prsten
catechol.desc=Prsten od šest ugljika s dvije OH skupine. Dopamin dijeli ovu obitelj s adrenalinom.
decarboxylase.name=DOPA dekarboksilaza
decarboxylase.desc=Enzim koji u djeliću sekunde pretvara L-DOPA u dopamin.
noradrenaline.name=Noradrenalin
noradrenaline.desc=Još jedan korak enzima i dopamin postaje noradrenalin: budnost i "bori se ili bježi".
mao.name=Razgradnja MAO
mao.desc=Monoaminooksidaza razgrađuje dopamin. Što ide gore, mora se i počistiti.
vta.name=VTA
vta.desc=Ventralno tegmentalno područje: mala nakupina stanica koja šalje signal nagrade.
nigra.name=Substantia nigra
nigra.desc="Crna tvar". Njezin dopamin održava tvoje pokrete glatkima.
parkinsons.name=Parkinsonova bolest
parkinsons.desc=Kad neuroni nigre odumru, kretanje se zamrzne. L-DOPA ga može vratiti.
pathways.name=Četiri puta
pathways.desc=Mezolimbički, mezokortikalni, nigrostrijatalni, tuberoinfundibularni. Jedna molekula, četiri različita posla.
oxytocin.name=Oksitocin
oxytocin.desc=Hormon povezivanja udružuje se s dopaminom. Ljubav postaje nagrada.
parentlove.name=Roditeljska ljubav
parentlove.desc=Briga o bebi pali sustav nagrade. Evolucija pazi da se vratiš.
socialpain.name=Društvena bol
socialpain.desc=Odbacivanje boli u istim dijelovima mozga kao i tjelesna bol.
belonging.name=Pripadnost
belonging.desc=Biti dio skupine toliko je ugodno da će ljudi za to učiniti gotovo sve.
web.name=World Wide Web
web.desc=Poveznice: svaka stranica vodi na drugu stranicu. Zečja rupa se otvara.
search.name=Tražilice
search.desc=Svako pitanje, odgovoreno odmah. Znatiželja više nikad ne mora čekati.
algorithms.name=Algoritmi
algorithms.desc=Strojevi uče točno ono što te tjera da nastaviš gledati.
attention.name=Ekonomija pažnje
attention.desc=Tvoja pažnja postaje proizvod, a svi se za nju nadmeću.

hydroxylase.name=Tirozin-hidroksilaza
hydroxylase.desc=Spori korak. Ovaj enzim odlučuje koliko se dopamina uopće može proizvesti.
cofactors.name=Željezo i vitamini
cofactors.desc=Željezo, vitamin B6 i BH4 pomažu enzimima. Čak i molekula treba dobru prehranu.
membranes.name=Membrane
membranes.desc=Masni zid oko stanice. Unutra i vani postaju različiti svjetovi.
biofilms.name=Biofilmovi
biofilms.desc=Bakterije se zbijaju u sluzave gradove. Zajednički život se isplati.
chemotaxis.name=Kemotaksija
chemotaxis.desc=Bakterije plivaju prema hrani i dalje od otrova. Približi se ili izbjegni: najstariji izbor.
quorum.name=Osjet kvoruma
quorum.desc=Bakterije kemijskim signalima broje susjede, a onda djeluju sve odjednom.
glia.name=Glija stanice
glia.desc=Pomoćne stanice koje hrane, čiste i štite neurone. Neopjevani junaci.
nervenets.name=Živčane mreže
nervenets.desc=Meduze nemaju mozak, samo mrežu živaca. Dovoljno je za plivanje i žarenje.
octopus.name=Hobotnica
octopus.desc=Većina njenih neurona nalazi se u krakovima. Svaki krak gotovo misli sam za sebe.
insects.name=Mozak kukaca
insects.desc=Pčele pamte koje se cvijeće isplati. Signal nagrade označava ono slatko.
actionpotential.name=Akcijski potencijal
actionpotential.desc=Električni šiljak juri duž neurona. Signali postaju brzi.
ions.name=Ionski kanali
ions.desc=Sićušna vrata puštaju natrij unutra i kalij van. To je taj šiljak.
myelin.name=Mijelin
myelin.desc=Masni omotač oko živčanih vlakana čini signale i do sto puta bržima.
reflexes.name=Refleksi
reflexes.desc=Dodirneš nešto vruće i ruka se pomakne prije nego što uopće primijetiš.
electricbrain.name=Električni mozak
electricbrain.desc=Milijarde šiljaka svake sekunde. Svaka tvoja misao je struja.
fish.name=Ribe
fish.desc=Prve kralježnice. Osnovni raspored sustava nagrade već je tu.
reptiles.name=Gmazovi
reptiles.desc=Jaja na kopnu, sunčanje na kamenu. Stari nagoni: jedi, bježi, pari se.
amygdala.name=Amigdala
amygdala.desc=Dva "badema" duboko u mozgu koji sjećanjima daju strah i uzbuđenje.
phasic.name=Tonički i fazični
phasic.desc=Stalni mlaz dopamina drži te u pogonu. Nagli naleti govore: ovo je važno!
pleasure.name=Užitak
pleasure.desc=Ako je dopamin željenje, što je sviđanje? Uživanje rade druge kemikalije.
opioids.name=Prirodni opioidi
opioids.desc=Mozak proizvodi vlastite tvari slične morfiju. One rade pravo sviđanje.
endorphins.name=Endorfini
endorphins.desc=Bol, trud, smijeh. Trkački zanos dolazi iznutra.
hotspots.name=Hedonističke točke
hotspots.desc=Nekoliko točaka veličine graška pojačava užitak. Željenje ima puno više prostora.
anhedonia.name=Anhedonija
anhedonia.desc=Kad ti više ništa ne pričinjava zadovoljstvo. Često znak depresije ili izgaranja, i vrijedi o tome razgovarati.
primates.name=Primati
primates.desc=Veliki mozgovi, ruke koje hvataju i kompliciran društveni život.
juice.name=Kapi soka
juice.desc=Devedesetih su znanstvenici majmunima davali sok i gledali kako ga dopaminski neuroni uče predvidjeti.
grooming.name=Timarenje
grooming.desc=Međusobno čeprkanje po krznu. Smiruje, povezuje i stvara prijateljstva.
tools.name=Uporaba alata
tools.desc=Štapić izvlači termite. Pametni trikovi se nagrađuju i kopiraju.
socialrank.name=Društveni položaj
socialrank.desc=Penjanje po hijerarhiji mijenja dopaminske receptore u mozgu. Status ti uđe pod kožu.
art.name=Umjetnost
art.desc=Slike na zidovima špilja. Stvoriti nešto lijepo je ugodan osjećaj.
writing.name=Pismo
writing.desc=Misli sada mogu nadživjeti onoga tko ih misli. Priče putuju dalje nego ikad.
comfortfood.name=Hrana za utjehu
comfortfood.desc=Šećer i masnoća ublažavaju loš dan. Mozak točno pamti što je pomoglo.
lotteries.name=Lutrija
lotteries.desc=Sićušna šansa za ogromnu nagradu. Ljudi zapravo kupuju san.
sportsbetting.name=Sportsko klađenje
sportsbetting.desc=Svaka utakmica postaje oklada. Poznavanje sporta djeluje kao prednost, ali kladionica uvijek dobiva.
relapse.name=Recidiv
relapse.desc=Jedan okidač i stari put ponovno zasvijetli. Oporavak je rijetko ravna crta.
coins.name=Kovanice
coins.desc=Sjajni metal koji možeš zamijeniti za bilo što. Nagrada iza svih nagrada.
banks.name=Banke
banks.desc=Tvoj novac raste dok spavaš. Prva idle igra.
credit.name=Kredit
credit.desc=Uzmi sad, plati kasnije. Budućnost se troši danas.
stockmarket.name=Burza
stockmarket.desc=Cijene skaču gore-dolje cijeli dan. Neki ne mogu prestati gledati.
drugs.name=Droge
drugs.desc=Kemikalije koje izravno otimaju sustav nagrade. Bez ikakva truda.
nicotine.name=Nikotin
nicotine.desc=Stiže do mozga nekoliko sekundi nakon dima. Jedna od tvari koje najviše stvaraju ovisnost.
cocaine.name=Kokain
cocaine.desc=Sprječava uklanjanje dopamina. Nalet je velik, a pad još veći.
amphetamines.name=Amfetamini
amphetamines.desc=Izbacuju poplave dopamina iz stanica. Brzina i fokus, a onda iscrpljenost.
opioidcrisis.name=Opioidna kriza
opioidcrisis.desc=Lijekovi protiv bolova prodavani su kao sigurni. Izgubljeni su stotine tisuća života.
smartphone.name=Pametni telefon
smartphone.desc=Cijeli internet u džepu, uvijek nadohvat ruke.
touchscreen.name=Zaslon na dodir
touchscreen.desc=Povuci, dodirni, povuci za osvježavanje. Pokreti su stvoreni da budu ugodni.
apps.name=Trgovine aplikacija
apps.desc=Milijuni aplikacija bore se za mjesto na tvom početnom zaslonu.
alwayson.name=Uvijek na mreži
alwayson.desc=Nikad nema trenutka bez ekrana. Dosada gotovo nestaje.
phantom.name=Fantomske vibracije
phantom.desc=Osjetiš da ti mobitel vibrira, a nije. Mozak to iščekuje.
binge.name=Maratonsko gledanje
binge.desc=Sljedeća epizoda počinje za 5 sekundi. Pa sljedeća.
shopping.name=Kupnja jednim klikom
shopping.desc=Nagrada je kupnja, ne posjedovanje. Paket je gotovo usputna stvar.
influencers.name=Influenceri
influencers.desc=Savršeni životi, filtrirani i sponzorirani. Uspoređivanje je uvijek na jedan potez prsta.
dating.name=Aplikacije za upoznavanje
dating.desc=Povuci udesno. Ljubav pretvorena u igru.
gamification.name=Gamifikacija
gamification.desc=Bodovi, značke i razine dodaju se svemu, čak i pranju zubi.
streaks.name=Nizovi
streaks.desc=Ne prekidaj niz! Gubitak boli više nego što dobitak veseli.
leaderboards.name=Ljestvice
leaderboards.desc=Uvijek je netko iznad tebe. Penji se dalje.
recovery.name=Oporavak
recovery.desc=Osloboditi se je moguće. Mozak se može izliječiti.
mindfulness.name=Usredotočena svjesnost
mindfulness.desc=Primijeti žudnju, ali je ne slušaj. Poriv naraste, a onda izblijedi.
exercise.name=Tjelovježba
exercise.desc=Kretanje podiže raspoloženje i daje sustavu nagrade zdrav trening.
sleep.name=San
sleep.desc=Odmor resetira sustav nagrade. Umorni mozgovi žude za više.
nature.name=Priroda
nature.desc=Šetnja vani, bez obavijesti. Spore nagrade su također nagrade.
connection.name=Prava povezanost
connection.desc=Suprotnost ovisnosti je povezanost. Nazovi nekoga koga voliš.
transporter.name=Dopaminski transporter
transporter.desc=Pumpa zvana DAT reciklira dopamin. Mnoge droge napadaju upravo nju.
receptortypes.name=Pet receptora
receptortypes.desc=Od D1 do D5: pet vrsta priključnih mjesta zbog kojih jedna molekula obavlja mnogo poslova.
basalganglia.name=Bazalni gangliji
basalganglia.desc=Petlja moždanih područja koja odlučuje koja radnja pobjeđuje.
toomuch.name=Previše dopamina
toomuch.desc=Preaktivan dopamin može nasumičnim stvarima dati duboko značenje. Ima ulogu u psihozi.
loneliness.name=Usamljenost
loneliness.desc=Dugotrajna usamljenost štetna je za zdravlje otprilike kao pušenje.
friendship.name=Prijateljstvo
friendship.desc=Nekoliko bliskih prijatelja štiti tvoj um bolje od gotovo bilo čega.
darkpatterns.name=Mračni obrasci
darkpatterns.desc=Skriveni gumbi za odjavu, lažni odbrojavači, poruke koje ti nameću krivnju. Dizajn koji te vara.
humanetech.name=Humana tehnologija
humanetech.desc=Neki dizajneri pokušavaju stvoriti aplikacije koje poštuju tvoje vrijeme. To je početak.

autopilot.name=Autopilot
autopilot.desc=Tvoj mozak nastavlja željeti i kad nisi ovdje. Dok je igra zatvorena, zarađuješ dio svog prihoda.
anticipation.name=Iščekivanje
anticipation.desc=Razmišljanje o nagradi također oslobađa dopamin. Već samo saznanje da te igra čeka je ugodno.
cuememory.name=Pamćenje okidača
cuememory.desc=Zvuk, logo, doba dana. Mali podsjetnici vraćaju ti misli ovamo.
intrusive.name=Nametljive misli
intrusive.desc=Radiš nešto drugo, ali dio tebe još uvijek broji brojeve.
daydream.name=Sanjarenje
daydream.desc=Kad postane dosadno, misli ti odlutaju natrag do stabla.
rumination.name=Preživanje misli
rumination.desc=Iste misli vrtiš iznova i iznova, dugo nakon što si prestao igrati.
obsession.name=Opsesija
obsession.desc=Na umu ti je od buđenja do spavanja. Upravo tako te navike uhvate.
