# Example mod. Copy the whole "example-mod" folder into the game's "mods" folder to try it.

# New nodes: list their ids here, then describe each one (same format as the main tree.properties).
# Tip: start your ids with your mod's name so they never clash with other mods.
nodes=thrill_sports,thrill_junkie

thrill_sports.name=Extreme Sports
thrill_sports.desc=Jumping off things on purpose. Fear plus survival equals a huge rush.
thrill_sports.cost=15000000
thrill_sports.income=500000
thrill_sports.click=0
thrill_sports.shape=square
thrill_sports.x=780
thrill_sports.y=1620
# can require any node from the main tree (or from mods loaded before this one)
thrill_sports.requires=exploration

thrill_junkie.name=Adrenaline Junkie
thrill_junkie.desc=Every jump has to be higher than the last one. Sound familiar?
thrill_junkie.cost=40000000
thrill_junkie.income=1400000
thrill_junkie.click=100000
thrill_junkie.shape=circle
thrill_junkie.x=1020
thrill_junkie.y=1620
thrill_junkie.requires=thrill_sports

# Changing an existing node: set only the keys you want to change, everything else stays as it was.
exploration.desc=What's over that hill? Humans spread across the whole planet. Some of them never stop chasing the thrill.
