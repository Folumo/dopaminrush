# Deutsche Übersetzung des Baums: nur Namen, Beschreibungen und Währung. Zahlen und Verbindungen kommen aus tree.properties.
currency=Dopamin

tyrosine.name=Tyrosin
tyrosine.desc=Eine Aminosäure, die in der Ursuppe treibt. Jeder Rausch beginnt hier.
ldopa.name=L-DOPA
ldopa.desc=Hänge eine Hydroxylgruppe an Tyrosin. Eine winzige Änderung mit riesiger Zukunft.
enzymes.name=Enzyme
enzymes.desc=Die Chemie wird schneller. Deine Finger auch.
dopamine.name=Dopamin
dopamine.desc=C8H11NO2. Das Molekül des "Mehr" ist geboren.
receptors.name=Rezeptoren
receptors.desc=Zellen bilden Andockstellen, an die Dopamin binden kann. Jetzt hört jemand zu.
signals.name=Chemische Signale
signals.desc=Einzelne Zellen beginnen, mit Molekülen miteinander zu sprechen.
vesicles.name=Vesikel
vesicles.desc=Winzige Bläschen speichern Dopamin und geben es auf einmal frei. Der erste Schub.
neurons.name=Erste Neuronen
neurons.desc=Zellen, die auf das Senden von Signalen spezialisiert sind. Ein Nervensystem entsteht.
synapses.name=Synapsen
synapses.desc=Der Spalt zwischen Neuronen, über den Dopamin springt.
worm.name=Wurmgehirn
worm.desc=Ein winziger Wurm mit nur acht Dopamin-Neuronen. Er wird langsamer, wenn er Futter findet.
foodseeking.name=Nahrungssuche
foodseeking.desc=Futter finden, gut fühlen, wiederholen. Die allererste Belohnungsschleife.
movement.name=Bewegung
movement.desc=Dopamin lernt, Bewegung zu starten. Wer etwas will, braucht Beine.
reuptake.name=Wiederaufnahme
reuptake.desc=Pumpen holen Dopamin zurück. Jedes Hoch muss enden ... vorerst.
midbrain.name=Mittelhirn
midbrain.desc=Das VTA und die Substantia nigra. Dopamin bekommt ein Hauptquartier.
striatum.name=Striatum
striatum.desc=Hier werden Handlungen ausgewählt und Gewohnheiten gespeichert.
prediction.name=Vorhersagefehler
prediction.desc=Besser als erwartet: Spitze. Schlechter: Einbruch. Genau wie erwartet: gar nichts.
rewardpath.name=Belohnungsbahn
rewardpath.desc=Die mesolimbische Autobahn, vom VTA zum Nucleus accumbens.
wanting.name=Wollen vs. Mögen
wanting.desc=Dopamin ist kein Vergnügen. Es ist der Juckreiz, mehr davon zu bekommen.
learning.name=Belohnungslernen
learning.desc=Jedes Leckerli lehrt etwas. Jede Lektion will ein Leckerli.
novelty.name=Suche nach Neuem
novelty.desc=Neues leuchtet heller. Neugier wird zu ihrer eigenen Belohnung.
play.name=Spielen
play.desc=Junge Säugetiere raufen und jagen sich, einfach weil es sich gut anfühlt.
bonding.name=Soziale Bindungen
bonding.desc=Berührung, Fellpflege, Liebe. Andere Menschen werden zur Belohnung.
hunt.name=Die Jagd
hunt.desc=Die Verfolgung fühlt sich besser an als die Mahlzeit.
fire.name=Feuer und Festmahl
fire.desc=Gebratenes Fleisch, reifes Obst, volle Bäuche rund um die Flammen.
exploration.name=Erkundung
exploration.desc=Was liegt hinter dem Hügel? Menschen verbreiten sich über den ganzen Planeten.
music.name=Musik
music.desc=Rhythmus und Melodie jagen Schauer über den Rücken. Eine Belohnung aus reinem Klang.
stories.name=Geschichten
stories.desc=Der Cliffhanger wird erfunden. "Nur noch ein Kapitel."
status.name=Status
status.desc=Bewundert zu werden wird zu einer ganz eigenen Belohnung.
fermentation.name=Gärung
fermentation.desc=Obst verfault, jemand trinkt es, und niemand vergisst es je.
trade.name=Handel und Geld
trade.desc=Eine Belohnung, die man aufbewahren und zählen kann. Steigende Zahlen fühlen sich gut an.
habit.name=Gewohnheitsschleife
habit.desc=Auslöser, Routine, Belohnung. Oft genug wiederholt, läuft sie ohne dich.
tolerance.name=Toleranz
tolerance.desc=Derselbe Kick fühlt sich jedes Mal kleiner an. Du brauchst mehr.
craving.name=Verlangen
craving.desc=Das Gehirn feuert schon beim Auslöser, noch bevor die Belohnung überhaupt da ist.
stimulants.name=Stimulanzien
stimulants.desc=Kaffee, Tabak, Zucker. Ganze Handelsrouten, gebaut auf Dopamin.
gambling.name=Glücksspiel
gambling.desc=Vielleicht diesmal. Ungewissheit ist der stärkste Haken von allen.
withdrawal.name=Entzug
withdrawal.desc=Unter dem Ausgangsniveau. Das normale Leben wirkt plötzlich grau.
addiction.name=Sucht
addiction.desc=Wenn das Wollen das Steuer an sich reißt und es nicht mehr hergibt.
advertising.name=Werbung
advertising.desc=Jemand lernt, den Auslöser zu verkaufen.
slots.name=Spielautomaten
slots.desc=Variable Belohnungen aus Stahl. Lichter, Töne und Beinahe-Gewinne.
television.name=Fernsehen
television.desc=Eine leuchtende Kiste, der nie das Neue ausgeht.
internet.name=Das Internet
internet.desc=Jede Belohnung, die es je gab, nur einen Klick entfernt.
videogames.name=Videospiele
videogames.desc=Level, Beute und Highscores. Belohnungen nach Zeitplan.
likes.name=Likes
likes.desc=Ein Spielautomat in deiner Tasche, der in Anerkennung auszahlt.
scroll.name=Endloses Scrollen
scroll.desc=Es gibt kein Ende, also gibt es auch kein Signal zum Aufhören.
notifications.name=Benachrichtigungen
notifications.desc=Ding. Vielleicht wartet etwas auf dich.
lootboxes.name=Lootboxen
lootboxes.desc=Glücksspiel im Kostüm.
shortvideo.name=Kurzvideos
shortvideo.desc=Fünfzehn Sekunden Neues, für immer.
detox.name=Dopamin-Detox
detox.desc=Du legst das Handy weg. Für eine Weile.
neuroscience.name=Neurowissenschaft
neuroscience.desc=Endlich verstehen wir die Maschine. Sie zu verstehen schaltet sie nicht ab.
idlegames.name=Idle-Spiele
idlegames.desc=Zahlen steigen, während du überhaupt nichts tust. Kommt dir das bekannt vor?
thisgame.name=Dopamin Rush
thisgame.desc=Du spielst es gerade. Wie fühlst du dich?
final.name=Der letzte Rausch
final.desc=Hier passiert etwas Besonderes ...

catechol.name=Catechol-Ring
catechol.desc=Ein Ring aus sechs Kohlenstoffatomen mit zwei OH-Gruppen. Dopamin teilt diese Familie mit Adrenalin.
decarboxylase.name=DOPA-Decarboxylase
decarboxylase.desc=Das Enzym, das L-DOPA im Bruchteil einer Sekunde in Dopamin verwandelt.
noradrenaline.name=Noradrenalin
noradrenaline.desc=Noch ein Enzymschritt, und aus Dopamin wird Noradrenalin: Wachheit und Kampf-oder-Flucht.
mao.name=MAO-Abbau
mao.desc=Monoaminoxidase baut Dopamin ab. Was hochgeht, muss auch aufgeräumt werden.
vta.name=VTA
vta.desc=Das ventrale tegmentale Areal: eine kleine Zellgruppe, die das Belohnungssignal aussendet.
nigra.name=Substantia nigra
nigra.desc=Die "schwarze Substanz". Ihr Dopamin hält deine Bewegungen flüssig.
parkinsons.name=Parkinson
parkinsons.desc=Wenn die Neuronen der Nigra sterben, erstarrt die Bewegung. L-DOPA kann sie zurückbringen.
pathways.name=Vier Bahnen
pathways.desc=Mesolimbisch, mesokortikal, nigrostriatal, tuberoinfundibulär. Ein Molekül, vier verschiedene Aufgaben.
oxytocin.name=Oxytocin
oxytocin.desc=Das Bindungshormon tut sich mit Dopamin zusammen. Liebe wird belohnend.
parentlove.name=Elternliebe
parentlove.desc=Sich um ein Baby zu kümmern, aktiviert das Belohnungssystem. Die Evolution sorgt dafür, dass du zurückkommst.
socialpain.name=Sozialer Schmerz
socialpain.desc=Zurückweisung schmerzt in denselben Hirnregionen wie körperlicher Schmerz.
belonging.name=Zugehörigkeit
belonging.desc=Teil einer Gruppe zu sein fühlt sich so gut an, dass Menschen fast alles dafür tun.
web.name=World Wide Web
web.desc=Hyperlinks: Jede Seite führt zu einer anderen. Der Kaninchenbau öffnet sich.
search.name=Suchmaschinen
search.desc=Jede Frage, sofort beantwortet. Neugier muss nie wieder warten.
algorithms.name=Algorithmen
algorithms.desc=Maschinen lernen genau, was dich weiterschauen lässt.
attention.name=Aufmerksamkeitsökonomie
attention.desc=Deine Aufmerksamkeit wird zum Produkt, und alle bieten darauf.

hydroxylase.name=Tyrosinhydroxylase
hydroxylase.desc=Der langsame Schritt. Dieses Enzym bestimmt, wie viel Dopamin überhaupt entstehen kann.
cofactors.name=Eisen und Vitamine
cofactors.desc=Eisen, Vitamin B6 und BH4 helfen den Enzymen. Selbst ein Molekül braucht gute Ernährung.
membranes.name=Membranen
membranes.desc=Eine Fettwand um die Zelle. Innen und außen werden zu verschiedenen Welten.
biofilms.name=Biofilme
biofilms.desc=Bakterien drängen sich zu schleimigen Städten zusammen. Zusammenleben lohnt sich.
chemotaxis.name=Chemotaxis
chemotaxis.desc=Bakterien schwimmen zur Nahrung und weg vom Gift. Hin oder weg: die älteste Entscheidung.
quorum.name=Quorum Sensing
quorum.desc=Bakterien zählen ihre Nachbarn über chemische Signale und handeln dann alle gleichzeitig.
glia.name=Gliazellen
glia.desc=Helferzellen, die Neuronen ernähren, reinigen und schützen. Die stillen Helden.
nervenets.name=Nervennetze
nervenets.desc=Quallen haben kein Gehirn, nur ein Netz aus Nerven. Das reicht zum Schwimmen und Nesseln.
octopus.name=Oktopus
octopus.desc=Die meisten seiner Neuronen sitzen in den Armen. Jeder Arm denkt fast für sich selbst.
insects.name=Insektengehirne
insects.desc=Bienen merken sich, welche Blüten sich lohnen. Ein Belohnungssignal markiert die süßen.
actionpotential.name=Aktionspotenzial
actionpotential.desc=Ein elektrischer Impuls rast am Neuron entlang. Signale werden schnell.
ions.name=Ionenkanäle
ions.desc=Winzige Tore lassen Natrium hinein- und Kalium hinausströmen. Das ist der Impuls.
myelin.name=Myelin
myelin.desc=Eine Fettschicht um die Nervenfasern macht Signale bis zu hundertmal schneller.
reflexes.name=Reflexe
reflexes.desc=Fass etwas Heißes an und deine Hand zuckt weg, bevor du es merkst.
electricbrain.name=Das elektrische Gehirn
electricbrain.desc=Milliarden Impulse pro Sekunde. Jeder deiner Gedanken ist Elektrizität.
fish.name=Fische
fish.desc=Die ersten Wirbelsäulen. Der Grundbauplan des Belohnungssystems steht schon.
reptiles.name=Reptilien
reptiles.desc=Eier an Land, Sonnenbaden auf dem Stein. Die alten Instinkte: fressen, fliehen, paaren.
amygdala.name=Amygdala
amygdala.desc=Zwei Mandeln tief im Gehirn, die Erinnerungen mit Angst und Aufregung markieren.
phasic.name=Tonisch und phasisch
phasic.desc=Ein stetiges Rinnsal Dopamin hält dich am Laufen. Plötzliche Schübe sagen: Das ist wichtig!
pleasure.name=Genuss
pleasure.desc=Wenn Dopamin das Wollen ist, was ist dann das Mögen? Das Genießen übernehmen andere Stoffe.
opioids.name=Körpereigene Opioide
opioids.desc=Das Gehirn stellt eigene morphinähnliche Stoffe her. Sie sind das echte Mögen.
endorphins.name=Endorphine
endorphins.desc=Schmerz, Anstrengung, Lachen. Das Läuferhoch kommt von innen.
hotspots.name=Genuss-Hotspots
hotspots.desc=Ein paar erbsengroße Stellen verstärken den Genuss. Das Wollen hat viel mehr Platz.
anhedonia.name=Anhedonie
anhedonia.desc=Wenn sich nichts mehr gut anfühlt. Oft ein Zeichen von Depression oder Burnout, und es lohnt sich, darüber zu reden.
primates.name=Primaten
primates.desc=Große Gehirne, greifende Hände und ein kompliziertes Sozialleben.
juice.name=Safttropfen
juice.desc=In den 1990ern gaben Forscher Affen Saft und sahen zu, wie Dopamin-Neuronen lernten, ihn vorherzusagen.
grooming.name=Fellpflege
grooming.desc=Gegenseitiges Lausen. Beruhigt, verbindet und schafft Freundschaften.
tools.name=Werkzeuggebrauch
tools.desc=Ein Stöckchen angelt Termiten. Clevere Tricks werden belohnt und nachgemacht.
socialrank.name=Rangordnung
socialrank.desc=Der Aufstieg in der Hierarchie verändert die Dopaminrezeptoren im Gehirn. Status geht unter die Haut.
art.name=Kunst
art.desc=Malereien an Höhlenwänden. Etwas Schönes zu erschaffen fühlt sich gut an.
writing.name=Schrift
writing.desc=Gedanken können jetzt den Denker überleben. Geschichten reisen weiter als je zuvor.
comfortfood.name=Seelenfutter
comfortfood.desc=Zucker und Fett trösten über einen schlechten Tag. Das Gehirn merkt sich genau, was geholfen hat.
lotteries.name=Lotto
lotteries.desc=Eine winzige Chance auf einen riesigen Gewinn. Was man wirklich kauft, ist der Traum.
sportsbetting.name=Sportwetten
sportsbetting.desc=Jedes Spiel wird zur Wette. Sich auszukennen fühlt sich wie ein Vorteil an, aber der Buchmacher gewinnt trotzdem.
relapse.name=Rückfall
relapse.desc=Ein Auslöser, und der alte Pfad leuchtet wieder auf. Genesung verläuft selten geradlinig.
coins.name=Münzen
coins.desc=Glänzendes Metall, das man gegen alles tauschen kann. Die Belohnung hinter allen Belohnungen.
banks.name=Banken
banks.desc=Dein Geld wächst, während du schläfst. Das erste Idle-Spiel.
credit.name=Kredit
credit.desc=Jetzt haben, später zahlen. Die Zukunft wird heute ausgegeben.
stockmarket.name=Börse
stockmarket.desc=Die Kurse zucken den ganzen Tag auf und ab. Manche können nicht aufhören hinzusehen.
drugs.name=Drogen
drugs.desc=Stoffe, die das Belohnungssystem direkt kapern. Ganz ohne Anstrengung.
nicotine.name=Nikotin
nicotine.desc=Erreicht das Gehirn Sekunden nach einem Zug. Einer der am stärksten süchtig machenden Stoffe überhaupt.
cocaine.name=Kokain
cocaine.desc=Verhindert, dass Dopamin weggeräumt wird. Der Rausch ist groß, der Absturz größer.
amphetamines.name=Amphetamine
amphetamines.desc=Treiben Fluten von Dopamin aus den Zellen. Tempo und Fokus, danach Erschöpfung.
opioidcrisis.name=Opioidkrise
opioidcrisis.desc=Verschreibungspflichtige Schmerzmittel wurden als sicher verkauft. Hunderttausende Leben gingen verloren.
smartphone.name=Smartphone
smartphone.desc=Das ganze Internet in der Hosentasche, immer griffbereit.
touchscreen.name=Touchscreen
touchscreen.desc=Wischen, tippen, zum Aktualisieren ziehen. Die Gesten sollen sich gut anfühlen.
apps.name=App-Stores
apps.desc=Millionen Apps kämpfen um einen Platz auf deinem Startbildschirm.
alwayson.name=Immer online
alwayson.desc=Es gibt keinen Moment mehr ohne Bildschirm. Langeweile verschwindet fast ganz.
phantom.name=Phantomvibrationen
phantom.desc=Du spürst dein Handy vibrieren, aber es war nichts. Dein Gehirn wartet darauf.
binge.name=Binge-Watching
binge.desc=Die nächste Folge startet in 5 Sekunden. Und dann die nächste.
shopping.name=Shoppen mit einem Klick
shopping.desc=Die Belohnung ist das Kaufen, nicht das Haben. Das Paket ist fast Nebensache.
influencers.name=Influencer
influencers.desc=Perfekte Leben, gefiltert und gesponsert. Der Vergleich ist immer nur ein Wischen entfernt.
dating.name=Dating-Apps
dating.desc=Nach rechts wischen. Liebe als Spiel.
gamification.name=Gamification
gamification.desc=Punkte, Abzeichen und Level kommen überall dazu, sogar beim Zähneputzen.
streaks.name=Serien
streaks.desc=Reiß die Kette nicht ab! Verlieren tut mehr weh, als Gewinnen sich gut anfühlt.
leaderboards.name=Bestenlisten
leaderboards.desc=Es gibt immer jemanden über dir. Klettere weiter.
recovery.name=Genesung
recovery.desc=Sich zu befreien ist möglich. Das Gehirn kann heilen.
mindfulness.name=Achtsamkeit
mindfulness.desc=Das Verlangen bemerken, ohne ihm zu gehorchen. Der Drang steigt und verebbt wieder.
exercise.name=Bewegung
exercise.desc=Bewegung hebt die Stimmung und gibt dem Belohnungssystem ein gesundes Training.
sleep.name=Schlaf
sleep.desc=Ruhe setzt das Belohnungssystem zurück. Müde Gehirne verlangen nach mehr.
nature.name=Natur
nature.desc=Ein Spaziergang draußen, ohne Benachrichtigungen. Langsame Belohnungen sind auch Belohnungen.
connection.name=Echte Verbindung
connection.desc=Das Gegenteil von Sucht ist Verbindung. Ruf jemanden an, den du liebst.
transporter.name=Dopamintransporter
transporter.desc=Eine Pumpe namens DAT recycelt Dopamin. Viele Drogen greifen genau diese Pumpe an.
receptortypes.name=Fünf Rezeptoren
receptortypes.desc=D1 bis D5: fünf Arten von Andockstellen, mit denen ein Molekül viele Aufgaben erledigt.
basalganglia.name=Basalganglien
basalganglia.desc=Eine Schleife von Hirnregionen, die entscheidet, welche Handlung gewinnt.
toomuch.name=Zu viel Dopamin
toomuch.desc=Überaktives Dopamin kann zufällige Dinge tief bedeutsam wirken lassen. Es spielt bei Psychosen eine Rolle.
loneliness.name=Einsamkeit
loneliness.desc=Langfristige Einsamkeit schadet der Gesundheit etwa so sehr wie Rauchen.
friendship.name=Freundschaft
friendship.desc=Ein paar enge Freunde schützen deine Psyche besser als fast alles andere.
darkpatterns.name=Dark Patterns
darkpatterns.desc=Versteckte Kündigungsknöpfe, falsche Countdowns, Schuldgefühl-Nachrichten. Design, das dich austrickst.
humanetech.name=Humane Technik
humanetech.desc=Manche Designer versuchen, Apps zu bauen, die deine Zeit respektieren. Ein Anfang.
