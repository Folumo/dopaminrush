# Tradução da árvore para português: só nomes, descrições e moeda. Números e ligações vêm de tree.properties.
currency=Dopamina

tyrosine.name=Tirosina
tyrosine.desc=Um aminoácido flutuando na sopa primordial. Toda descarga começa aqui.
ldopa.name=L-DOPA
ldopa.desc=Adicione um grupo hidroxila à tirosina. Uma mudança minúscula com um futuro enorme.
enzymes.name=Enzimas
enzymes.desc=A química acelera. Seus dedos também.
dopamine.name=Dopamina
dopamine.desc=C8H11NO2. Nasce a molécula do "mais".
receptors.name=Receptores
receptors.desc=As células criam encaixes onde a dopamina pode se prender. Agora alguém está ouvindo.
signals.name=Sinais químicos
signals.desc=Células isoladas começam a conversar umas com as outras usando moléculas.
vesicles.name=Vesículas
vesicles.desc=Bolhinhas guardam dopamina e a liberam de uma vez. A primeira descarga.
neurons.name=Primeiros neurônios
neurons.desc=Células especializadas em enviar sinais. Começa um sistema nervoso.
synapses.name=Sinapses
synapses.desc=O espaço entre neurônios por onde a dopamina salta.
worm.name=Cérebro de verme
worm.desc=Um verme minúsculo com apenas oito neurônios de dopamina. Ele desacelera quando encontra comida.
foodseeking.name=Busca por comida
foodseeking.desc=Encontre comida, sinta-se bem, repita. O primeiro ciclo de recompensa.
movement.name=Movimento
movement.desc=A dopamina aprende a iniciar o movimento. Querer algo precisa de pernas.
reuptake.name=Recaptação
reuptake.desc=Bombas puxam a dopamina de volta. Toda onda tem que acabar... por enquanto.
midbrain.name=Mesencéfalo
midbrain.desc=A área tegmental ventral (ATV) e a substância negra. A dopamina ganha um quartel-general.
striatum.name=Corpo estriado
striatum.desc=Onde as ações são escolhidas e os hábitos são guardados.
prediction.name=Erro de predição
prediction.desc=Melhor que o esperado: pico. Pior: queda. Exatamente como esperado: nada.
rewardpath.name=Via de recompensa
rewardpath.desc=A autoestrada mesolímbica, da ATV ao núcleo accumbens.
wanting.name=Querer vs. gostar
wanting.desc=Dopamina não é prazer. É a coceira de conseguir mais.
learning.name=Aprendizado por recompensa
learning.desc=Cada petisco ensina algo. Cada lição quer um petisco.
novelty.name=Busca por novidade
novelty.desc=Coisas novas brilham mais. A curiosidade vira sua própria recompensa.
play.name=Brincadeira
play.desc=Mamíferos jovens lutam e se perseguem só porque é gostoso.
bonding.name=Laços sociais
bonding.desc=Toque, cuidado, amor. Outras pessoas se tornam a recompensa.
hunt.name=A caçada
hunt.desc=A perseguição é melhor que a refeição.
fire.name=Fogo e banquetes
fire.desc=Carne assada, fruta madura, barrigas cheias ao redor das chamas.
exploration.name=Exploração
exploration.desc=O que tem depois daquele morro? Os humanos se espalham pelo planeta inteiro.
music.name=Música
music.desc=Ritmo e melodia dão arrepios na espinha. Uma recompensa feita de puro som.
stories.name=Histórias
stories.desc=Inventam o gancho no fim do capítulo. "Só mais um capítulo."
status.name=Status
status.desc=Ser admirado vira uma recompensa por si só.
fermentation.name=Fermentação
fermentation.desc=A fruta apodrece, alguém a bebe e ninguém nunca esquece.
trade.name=Comércio e dinheiro
trade.desc=Uma recompensa que dá para guardar e contar. Ver os números subirem é bom.
habit.name=Ciclo do hábito
habit.desc=Gatilho, rotina, recompensa. Repita o bastante e ele roda sem você.
tolerance.name=Tolerância
tolerance.desc=O mesmo estímulo parece menor a cada vez. Você precisa de mais.
craving.name=Fissura
craving.desc=O cérebro dispara com o gatilho, antes mesmo de a recompensa chegar.
stimulants.name=Estimulantes
stimulants.desc=Café, tabaco, açúcar. Rotas comerciais inteiras construídas sobre a dopamina.
gambling.name=Apostas
gambling.desc=Talvez desta vez. A incerteza é o anzol mais forte de todos.
withdrawal.name=Abstinência
withdrawal.desc=Abaixo do normal. A vida comum começa a parecer cinza.
addiction.name=Vício
addiction.desc=Quando o querer agarra o volante e não devolve mais.
advertising.name=Publicidade
advertising.desc=Alguém aprende a vender o gatilho.
slots.name=Caça-níqueis
slots.desc=Recompensas variáveis feitas de aço. Luzes, sons e quase-vitórias.
television.name=Televisão
television.desc=Uma caixa brilhante que nunca fica sem algo novo.
internet.name=A internet
internet.desc=Toda recompensa já criada, a um clique de distância.
videogames.name=Videogames
videogames.desc=Fases, saques e recordes. Recompensas com hora marcada.
likes.name=Curtidas
likes.desc=Um caça-níqueis no seu bolso que paga em aprovação.
scroll.name=Rolagem infinita
scroll.desc=Não existe fundo, então não existe sinal para parar.
notifications.name=Notificações
notifications.desc=Plim. Talvez algo esteja esperando por você.
lootboxes.name=Caixas de recompensa
lootboxes.desc=Apostas fantasiadas.
shortvideo.name=Vídeos curtos
shortvideo.desc=Quinze segundos de novidade, para sempre.
detox.name=Detox de dopamina
detox.desc=Você larga o celular. Por um tempo.
neuroscience.name=Neurociência
neuroscience.desc=Finalmente entendemos a máquina. Entendê-la não a desliga.
idlegames.name=Jogos idle
idlegames.desc=Os números sobem enquanto você não faz absolutamente nada. Soa familiar?
thisgame.name=Dopamin Rush
thisgame.desc=Você está jogando agora mesmo. Como você se sente?
final.name=A descarga final
final.desc=Algo especial acontece aqui...

catechol.name=Anel de catecol
catechol.desc=Um anel de seis carbonos com dois grupos OH. A dopamina divide essa família com a adrenalina.
decarboxylase.name=DOPA descarboxilase
decarboxylase.desc=A enzima que transforma L-DOPA em dopamina numa fração de segundo.
noradrenaline.name=Noradrenalina
noradrenaline.desc=Mais um passo enzimático e a dopamina vira noradrenalina: alerta e luta ou fuga.
mao.name=Degradação pela MAO
mao.desc=A monoamina oxidase decompõe a dopamina. Tudo que sobe precisa ser limpo.
vta.name=ATV
vta.desc=A área tegmental ventral: um pequeno grupo de células que envia o sinal de recompensa.
nigra.name=Substância negra
nigra.desc=A "substância negra". Sua dopamina mantém seus movimentos suaves.
parkinsons.name=Parkinson
parkinsons.desc=Quando os neurônios da substância negra morrem, o movimento congela. A L-DOPA pode trazê-lo de volta.
pathways.name=Quatro vias
pathways.desc=Mesolímbica, mesocortical, nigroestriatal, tuberoinfundibular. Uma molécula, quatro trabalhos diferentes.
oxytocin.name=Ocitocina
oxytocin.desc=O hormônio do vínculo se junta à dopamina. O amor vira recompensa.
parentlove.name=Amor de pais
parentlove.desc=Cuidar de um bebê acende o sistema de recompensa. A evolução garante que você volte.
socialpain.name=Dor social
socialpain.desc=A rejeição dói nas mesmas áreas do cérebro que a dor física.
belonging.name=Pertencimento
belonging.desc=Fazer parte de um grupo é tão bom que as pessoas fazem quase qualquer coisa por isso.
web.name=World Wide Web
web.desc=Hiperlinks: cada página leva a outra. A toca do coelho se abre.
search.name=Buscadores
search.desc=Qualquer pergunta, respondida na hora. A curiosidade nunca mais precisa esperar.
algorithms.name=Algoritmos
algorithms.desc=As máquinas aprendem exatamente o que mantém você assistindo.
attention.name=Economia da atenção
attention.desc=Sua atenção vira o produto, e todo mundo está dando lances por ela.

hydroxylase.name=Tirosina hidroxilase
hydroxylase.desc=O passo lento. Esta enzima decide quanta dopamina pode ser produzida.
cofactors.name=Ferro e vitaminas
cofactors.desc=Ferro, vitamina B6 e BH4 ajudam as enzimas. Até uma molécula precisa de boa alimentação.
membranes.name=Membranas
membranes.desc=Uma parede de gordura ao redor da célula. Dentro e fora viram mundos diferentes.
biofilms.name=Biofilmes
biofilms.desc=Bactérias se amontoam em cidades viscosas. Viver junto compensa.
chemotaxis.name=Quimiotaxia
chemotaxis.desc=Bactérias nadam em direção à comida e para longe do veneno. Aproximar ou evitar: a escolha mais antiga.
quorum.name=Quorum sensing
quorum.desc=Bactérias contam as vizinhas com sinais químicos e depois agem todas de uma vez.
glia.name=Células gliais
glia.desc=Células ajudantes que alimentam, limpam e protegem os neurônios. As heroínas anônimas.
nervenets.name=Redes nervosas
nervenets.desc=Águas-vivas não têm cérebro, só uma rede de nervos. Basta para nadar e queimar.
octopus.name=Polvo
octopus.desc=A maioria dos seus neurônios fica nos braços. Cada braço quase pensa sozinho.
insects.name=Cérebros de insetos
insects.desc=Abelhas lembram quais flores valem a pena. Um sinal de recompensa marca as doces.
actionpotential.name=Potencial de ação
actionpotential.desc=Um pico elétrico corre ao longo do neurônio. Os sinais ficam rápidos.
ions.name=Canais iônicos
ions.desc=Pequenos portões deixam o sódio entrar e o potássio sair. Esse é o pico.
myelin.name=Mielina
myelin.desc=Uma capa de gordura ao redor das fibras nervosas deixa os sinais até cem vezes mais rápidos.
reflexes.name=Reflexos
reflexes.desc=Toque em algo quente e a mão se mexe antes mesmo de você perceber.
electricbrain.name=O cérebro elétrico
electricbrain.desc=Bilhões de picos por segundo. Cada pensamento seu é eletricidade.
fish.name=Peixes
fish.desc=As primeiras colunas vertebrais. O plano básico do sistema de recompensa já está lá.
reptiles.name=Répteis
reptiles.desc=Ovos em terra firme, tomando sol. Os velhos instintos: comer, fugir, acasalar.
amygdala.name=Amígdala
amygdala.desc=Duas amêndoas no fundo do cérebro que marcam as memórias com medo e emoção.
phasic.name=Tônico e fásico
phasic.desc=Um fluxo constante de dopamina mantém você em movimento. Picos repentinos dizem: isto importa!
pleasure.name=Prazer
pleasure.desc=Se a dopamina é o querer, o que é o gostar? Outras substâncias cuidam do aproveitar.
opioids.name=Opioides naturais
opioids.desc=O cérebro fabrica suas próprias substâncias parecidas com a morfina. Elas são o verdadeiro gostar.
endorphins.name=Endorfinas
endorphins.desc=Dor, esforço, risada. A euforia do corredor vem de dentro.
hotspots.name=Pontos hedônicos
hotspots.desc=Alguns pontos do tamanho de uma ervilha intensificam o prazer. O querer ocupa muito mais espaço.
anhedonia.name=Anedonia
anhedonia.desc=Quando nada mais parece bom. Muitas vezes é sinal de depressão ou esgotamento, e vale a pena conversar sobre isso.
primates.name=Primatas
primates.desc=Cérebros grandes, mãos que agarram e vidas sociais complicadas.
juice.name=Gotas de suco
juice.desc=Nos anos 1990, cientistas deram suco a macacos e viram os neurônios de dopamina aprenderem a prevê-lo.
grooming.name=Catação
grooming.desc=Mexer no pelo um do outro. Acalma, une e é um jeito de fazer amigos.
tools.name=Uso de ferramentas
tools.desc=Um graveto pesca cupins. Truques espertos são recompensados e copiados.
socialrank.name=Posição social
socialrank.desc=Subir na hierarquia muda os receptores de dopamina do cérebro. O status entra na pele.
art.name=Arte
art.desc=Pinturas nas paredes das cavernas. Criar algo bonito faz bem.
writing.name=Escrita
writing.desc=Os pensamentos agora podem sobreviver a quem os pensou. As histórias viajam mais longe do que nunca.
comfortfood.name=Comida afetiva
comfortfood.desc=Açúcar e gordura aliviam um dia ruim. O cérebro lembra exatamente o que ajudou.
lotteries.name=Loterias
lotteries.desc=Uma chance minúscula de um prêmio enorme. O que as pessoas compram de verdade é o sonho.
sportsbetting.name=Apostas esportivas
sportsbetting.desc=Cada partida vira uma aposta. Entender do esporte parece uma vantagem, mas a casa sempre ganha.
relapse.name=Recaída
relapse.desc=Um gatilho e o velho caminho se acende de novo. A recuperação raramente é uma linha reta.
coins.name=Moedas
coins.desc=Metal brilhante que dá para trocar por qualquer coisa. A recompensa por trás de todas as recompensas.
banks.name=Bancos
banks.desc=Seu dinheiro cresce enquanto você dorme. O primeiro jogo idle.
credit.name=Crédito
credit.desc=Tenha agora, pague depois. O futuro é gasto hoje.
stockmarket.name=Bolsa de valores
stockmarket.desc=Os preços sobem e descem o dia inteiro. Tem gente que não consegue parar de olhar.
drugs.name=Drogas
drugs.desc=Substâncias que sequestram diretamente o sistema de recompensa. Sem esforço nenhum.
nicotine.name=Nicotina
nicotine.desc=Chega ao cérebro segundos depois de uma tragada. Uma das substâncias mais viciantes que se conhecem.
cocaine.name=Cocaína
cocaine.desc=Impede que a dopamina seja recolhida. A euforia é grande, a queda é maior.
amphetamines.name=Anfetaminas
amphetamines.desc=Empurram enxurradas de dopamina para fora das células. Velocidade e foco, depois exaustão.
opioidcrisis.name=Crise dos opioides
opioidcrisis.desc=Analgésicos com receita foram vendidos como seguros. Centenas de milhares de vidas se perderam.
smartphone.name=Smartphone
smartphone.desc=A internet inteira no seu bolso, sempre ao alcance.
touchscreen.name=Tela sensível ao toque
touchscreen.desc=Deslize, toque, puxe para atualizar. Os gestos são feitos para dar prazer.
apps.name=Lojas de apps
apps.desc=Milhões de apps disputam um lugar na sua tela inicial.
alwayson.name=Sempre online
alwayson.desc=Nunca há um momento sem tela. O tédio quase desaparece.
phantom.name=Vibrações fantasmas
phantom.desc=Você sente o celular vibrar, mas ele não vibrou. Seu cérebro está esperando por isso.
binge.name=Maratonar séries
binge.desc=O próximo episódio começa em 5 segundos. E depois o próximo.
shopping.name=Compras com um clique
shopping.desc=A recompensa é comprar, não ter. O pacote é quase um detalhe.
influencers.name=Influenciadores
influencers.desc=Vidas perfeitas, filtradas e patrocinadas. A comparação está sempre a um deslizar de distância.
dating.name=Apps de namoro
dating.desc=Deslize para a direita. O amor virou um jogo.
gamification.name=Gamificação
gamification.desc=Pontos, medalhas e níveis são adicionados a tudo, até a escovar os dentes.
streaks.name=Sequências
streaks.desc=Não quebre a corrente! Perder dói mais do que ganhar alegra.
leaderboards.name=Placares
leaderboards.desc=Sempre tem alguém acima de você. Continue subindo.
recovery.name=Recuperação
recovery.desc=Libertar-se é possível. O cérebro pode se curar.
mindfulness.name=Atenção plena
mindfulness.desc=Perceba a fissura sem obedecer a ela. O impulso sobe e depois passa.
exercise.name=Exercício
exercise.desc=Mexer o corpo melhora o humor e dá ao sistema de recompensa um treino saudável.
sleep.name=Sono
sleep.desc=Descansar reinicia o sistema de recompensa. Cérebros cansados querem mais.
nature.name=Natureza
nature.desc=Uma caminhada ao ar livre, sem notificações. Recompensas lentas também são recompensas.
connection.name=Conexão de verdade
connection.desc=O oposto do vício é a conexão. Ligue para alguém que você ama.
transporter.name=Transportador de dopamina
transporter.desc=Uma bomba chamada DAT recicla a dopamina. Muitas drogas atacam justamente essa bomba.
receptortypes.name=Cinco receptores
receptortypes.desc=Do D1 ao D5: cinco tipos de encaixe que deixam uma molécula fazer muitos trabalhos.
basalganglia.name=Gânglios da base
basalganglia.desc=Um circuito de áreas do cérebro que decide qual ação vence.
toomuch.name=Dopamina demais
toomuch.desc=Dopamina hiperativa pode fazer coisas aleatórias parecerem profundamente significativas. Ela tem papel na psicose.
loneliness.name=Solidão
loneliness.desc=A solidão prolongada faz quase tão mal à saúde quanto fumar.
friendship.name=Amizade
friendship.desc=Alguns amigos próximos protegem sua mente melhor do que quase qualquer outra coisa.
darkpatterns.name=Padrões obscuros
darkpatterns.desc=Botões de cancelar escondidos, cronômetros falsos, mensagens que culpam você. Design que engana.
humanetech.name=Tecnologia humana
humanetech.desc=Alguns designers tentam criar apps que respeitam o seu tempo. É um começo.

autopilot.name=Piloto automático
autopilot.desc=Seu cérebro continua querendo mesmo quando você não está aqui. Enquanto o jogo está fechado, você ganha uma parte da sua renda.
anticipation.name=Expectativa
anticipation.desc=Pensar na recompensa também libera dopamina. Só de saber que o jogo está esperando já é bom.
cuememory.name=Memória de gatilhos
cuememory.desc=Um som, um logo, uma hora do dia. Pequenos lembretes trazem sua mente de volta para cá.
intrusive.name=Pensamentos intrusivos
intrusive.desc=Você está fazendo outra coisa, mas uma parte de você ainda está contando números.
daydream.name=Devaneio
daydream.desc=Quando as coisas ficam chatas, sua mente volta para a árvore.
rumination.name=Ruminação
rumination.desc=Repassar os mesmos pensamentos de novo e de novo, muito depois de parar de jogar.
obsession.name=Obsessão
obsession.desc=Está na sua cabeça do momento em que acorda até dormir. É exatamente assim que os hábitos pegam você.
