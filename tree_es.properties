# Traducción del árbol al español: solo nombres, descripciones y moneda. Los números y enlaces vienen de tree.properties.
currency=Dopamina

tyrosine.name=Tirosina
tyrosine.desc=Un aminoácido que flota en la sopa primordial. Todo subidón empieza aquí.
ldopa.name=L-DOPA
ldopa.desc=Añade un grupo hidroxilo a la tirosina. Un cambio diminuto con un futuro enorme.
enzymes.name=Enzimas
enzymes.desc=La química se acelera. Tus dedos también.
dopamine.name=Dopamina
dopamine.desc=C8H11NO2. Nace la molécula del "más".
receptors.name=Receptores
receptors.desc=Las células crean anclajes donde la dopamina puede encajar. Ahora alguien escucha.
signals.name=Señales químicas
signals.desc=Las células individuales empiezan a hablarse con moléculas.
vesicles.name=Vesículas
vesicles.desc=Diminutas burbujas guardan dopamina y la liberan de golpe. La primera descarga.
neurons.name=Primeras neuronas
neurons.desc=Células especializadas en enviar señales. Empieza un sistema nervioso.
synapses.name=Sinapsis
synapses.desc=El hueco entre neuronas por el que salta la dopamina.
worm.name=Cerebro de gusano
worm.desc=Un gusano diminuto con solo ocho neuronas de dopamina. Va más despacio cuando encuentra comida.
foodseeking.name=Búsqueda de comida
foodseeking.desc=Encuentra comida, siéntete bien, repite. El primer bucle de recompensa.
movement.name=Movimiento
movement.desc=La dopamina aprende a iniciar el movimiento. Para desear algo hacen falta piernas.
reuptake.name=Recaptación
reuptake.desc=Unas bombas recogen la dopamina de vuelta. Todo subidón tiene que acabar... por ahora.
midbrain.name=Mesencéfalo
midbrain.desc=El área tegmental ventral (ATV) y la sustancia negra. La dopamina consigue su cuartel general.
striatum.name=Cuerpo estriado
striatum.desc=Donde se eligen las acciones y se guardan los hábitos.
prediction.name=Error de predicción
prediction.desc=Mejor de lo esperado: pico. Peor: bajón. Exactamente lo esperado: nada en absoluto.
rewardpath.name=Vía de recompensa
rewardpath.desc=La autopista mesolímbica, del ATV al núcleo accumbens.
wanting.name=Querer vs. gustar
wanting.desc=La dopamina no es placer. Es el picor de conseguir más.
learning.name=Aprendizaje por recompensa
learning.desc=Cada premio enseña algo. Cada lección quiere un premio.
novelty.name=Búsqueda de novedad
novelty.desc=Lo nuevo brilla más. La curiosidad se convierte en su propia recompensa.
play.name=Juego
play.desc=Los mamíferos jóvenes luchan y se persiguen solo porque se siente bien.
bonding.name=Vínculos sociales
bonding.desc=Contacto, acicalamiento, amor. Las demás personas se convierten en la recompensa.
hunt.name=La caza
hunt.desc=La persecución sabe mejor que la comida.
fire.name=Fuego y banquetes
fire.desc=Carne asada, fruta madura, barrigas llenas alrededor de las llamas.
exploration.name=Exploración
exploration.desc=¿Qué hay detrás de esa colina? Los humanos se extienden por todo el planeta.
music.name=Música
music.desc=El ritmo y la melodía provocan escalofríos. Una recompensa hecha de sonido puro.
stories.name=Historias
stories.desc=Se inventa el final en suspense. "Solo un capítulo más."
status.name=Estatus
status.desc=Ser admirado se convierte en una recompensa por sí misma.
fermentation.name=Fermentación
fermentation.desc=La fruta se pudre, alguien se la bebe y nadie lo olvida jamás.
trade.name=Comercio y dinero
trade.desc=Una recompensa que puedes guardar y contar. Ver subir los números sienta bien.
habit.name=Bucle del hábito
habit.desc=Señal, rutina, recompensa. Repítelo lo suficiente y funciona sin ti.
tolerance.name=Tolerancia
tolerance.desc=El mismo golpe se siente más pequeño cada vez. Necesitas más.
craving.name=Ansia
craving.desc=El cerebro se dispara con la señal, antes incluso de que llegue la recompensa.
stimulants.name=Estimulantes
stimulants.desc=Café, tabaco, azúcar. Rutas comerciales enteras construidas sobre la dopamina.
gambling.name=Apuestas
gambling.desc=Quizá esta vez. La incertidumbre es el anzuelo más fuerte de todos.
withdrawal.name=Abstinencia
withdrawal.desc=Por debajo del nivel normal. La vida cotidiana empieza a parecer gris.
addiction.name=Adicción
addiction.desc=Cuando el deseo toma el volante y no lo devuelve.
advertising.name=Publicidad
advertising.desc=Alguien aprende a vender la señal.
slots.name=Tragaperras
slots.desc=Recompensas variables hechas de acero. Luces, sonidos y casi-aciertos.
television.name=Televisión
television.desc=Una caja luminosa a la que nunca se le acaba algo nuevo.
internet.name=Internet
internet.desc=Toda recompensa jamás creada, a un clic de distancia.
videogames.name=Videojuegos
videogames.desc=Niveles, botín y récords. Recompensas con horario.
likes.name=Me gusta
likes.desc=Una tragaperras en tu bolsillo que paga en aprobación.
scroll.name=Scroll infinito
scroll.desc=No hay fondo, así que no hay señal para parar.
notifications.name=Notificaciones
notifications.desc=Ding. Puede que algo te esté esperando.
lootboxes.name=Cajas de botín
lootboxes.desc=Apuestas disfrazadas.
shortvideo.name=Vídeos cortos
shortvideo.desc=Quince segundos de novedad, para siempre.
detox.name=Detox de dopamina
detox.desc=Dejas el móvil. Durante un rato.
neuroscience.name=Neurociencia
neuroscience.desc=Por fin entendemos la máquina. Entenderla no la apaga.
idlegames.name=Juegos idle
idlegames.desc=Los números suben mientras no haces absolutamente nada. ¿Te suena?
thisgame.name=Dopamin Rush
thisgame.desc=Estás jugando ahora mismo. ¿Cómo te sientes?
final.name=El subidón final
final.desc=Aquí pasa algo especial...

catechol.name=Anillo de catecol
catechol.desc=Un anillo de seis carbonos con dos grupos OH. La dopamina comparte esta familia con la adrenalina.
decarboxylase.name=DOPA descarboxilasa
decarboxylase.desc=La enzima que convierte la L-DOPA en dopamina en una fracción de segundo.
noradrenaline.name=Noradrenalina
noradrenaline.desc=Un paso enzimático más y la dopamina se convierte en noradrenalina: alerta y lucha o huida.
mao.name=Degradación por MAO
mao.desc=La monoaminooxidasa descompone la dopamina. Lo que sube, hay que limpiarlo.
vta.name=ATV
vta.desc=El área tegmental ventral: un pequeño grupo de células que envía la señal de recompensa.
nigra.name=Sustancia negra
nigra.desc=La "sustancia negra". Su dopamina mantiene tus movimientos fluidos.
parkinsons.name=Párkinson
parkinsons.desc=Cuando mueren las neuronas de la sustancia negra, el movimiento se congela. La L-DOPA puede devolverlo.
pathways.name=Cuatro vías
pathways.desc=Mesolímbica, mesocortical, nigroestriatal, tuberoinfundibular. Una molécula, cuatro trabajos distintos.
oxytocin.name=Oxitocina
oxytocin.desc=La hormona del vínculo se une a la dopamina. El amor se vuelve gratificante.
parentlove.name=Amor de padres
parentlove.desc=Cuidar a un bebé enciende el sistema de recompensa. La evolución se asegura de que vuelvas.
socialpain.name=Dolor social
socialpain.desc=El rechazo duele en las mismas zonas del cerebro que el dolor físico.
belonging.name=Pertenencia
belonging.desc=Formar parte de un grupo sienta tan bien que la gente hará casi cualquier cosa por ello.
web.name=World Wide Web
web.desc=Hipervínculos: cada página lleva a otra. Se abre la madriguera del conejo.
search.name=Buscadores
search.desc=Cualquier pregunta, respondida al instante. La curiosidad ya nunca tiene que esperar.
algorithms.name=Algoritmos
algorithms.desc=Las máquinas aprenden exactamente qué te mantiene mirando.
attention.name=Economía de la atención
attention.desc=Tu atención se convierte en el producto, y todos pujan por ella.

hydroxylase.name=Tirosina hidroxilasa
hydroxylase.desc=El paso lento. Esta enzima decide cuánta dopamina se puede llegar a fabricar.
cofactors.name=Hierro y vitaminas
cofactors.desc=El hierro, la vitamina B6 y el BH4 ayudan a las enzimas. Hasta una molécula necesita buena dieta.
membranes.name=Membranas
membranes.desc=Una pared grasa alrededor de la célula. Dentro y fuera se vuelven mundos distintos.
biofilms.name=Biopelículas
biofilms.desc=Las bacterias se apiñan en ciudades viscosas. Vivir juntas compensa.
chemotaxis.name=Quimiotaxis
chemotaxis.desc=Las bacterias nadan hacia la comida y lejos del veneno. Acercarse o huir: la elección más antigua.
quorum.name=Detección de quórum
quorum.desc=Las bacterias cuentan a sus vecinas con señales químicas y luego actúan todas a la vez.
glia.name=Células gliales
glia.desc=Células ayudantes que alimentan, limpian y protegen a las neuronas. Las heroínas anónimas.
nervenets.name=Redes nerviosas
nervenets.desc=Las medusas no tienen cerebro, solo una red de nervios. Basta para nadar y picar.
octopus.name=Pulpo
octopus.desc=La mayoría de sus neuronas están en los brazos. Cada brazo casi piensa por sí mismo.
insects.name=Cerebros de insectos
insects.desc=Las abejas recuerdan qué flores valen la pena. Una señal de recompensa marca las dulces.
actionpotential.name=Potencial de acción
actionpotential.desc=Un pico eléctrico recorre la neurona. Las señales se vuelven rápidas.
ions.name=Canales iónicos
ions.desc=Diminutas compuertas dejan entrar el sodio y salir el potasio. Eso es el pico.
myelin.name=Mielina
myelin.desc=Una capa grasa alrededor de las fibras nerviosas hace las señales hasta cien veces más rápidas.
reflexes.name=Reflejos
reflexes.desc=Tocas algo caliente y la mano se aparta antes de que te des cuenta.
electricbrain.name=El cerebro eléctrico
electricbrain.desc=Miles de millones de picos por segundo. Cada pensamiento tuyo es electricidad.
fish.name=Peces
fish.desc=Las primeras columnas vertebrales. El plano básico del sistema de recompensa ya está ahí.
reptiles.name=Reptiles
reptiles.desc=Huevos en tierra firme, tomando el sol. Los viejos instintos: comer, huir, aparearse.
amygdala.name=Amígdala
amygdala.desc=Dos almendras en lo profundo del cerebro que marcan los recuerdos con miedo y emoción.
phasic.name=Tónico y fásico
phasic.desc=Un goteo constante de dopamina te mantiene en marcha. Los estallidos dicen: ¡esto importa!
pleasure.name=Placer
pleasure.desc=Si la dopamina es querer, ¿qué es gustar? Otras sustancias se encargan de disfrutar.
opioids.name=Opioides naturales
opioids.desc=El cerebro fabrica sus propias sustancias parecidas a la morfina. Ellas son el verdadero gustar.
endorphins.name=Endorfinas
endorphins.desc=Dolor, esfuerzo, risa. El subidón del corredor viene de dentro.
hotspots.name=Puntos hedónicos
hotspots.desc=Unos pocos puntos del tamaño de un guisante intensifican el placer. El querer ocupa mucho más.
anhedonia.name=Anhedonia
anhedonia.desc=Cuando ya nada te hace sentir bien. Suele ser señal de depresión o agotamiento, y vale la pena hablarlo.
primates.name=Primates
primates.desc=Cerebros grandes, manos que agarran y vidas sociales complicadas.
juice.name=Gotas de zumo
juice.desc=En los años 90, unos científicos dieron zumo a monos y vieron cómo las neuronas de dopamina aprendían a predecirlo.
grooming.name=Acicalamiento
grooming.desc=Rebuscar en el pelaje del otro. Calma, une y sirve para hacer amigos.
tools.name=Uso de herramientas
tools.desc=Un palito pesca termitas. Los trucos ingeniosos se premian y se copian.
socialrank.name=Rango social
socialrank.desc=Subir en la jerarquía cambia los receptores de dopamina del cerebro. El estatus se mete bajo la piel.
art.name=Arte
art.desc=Pinturas en las paredes de las cuevas. Crear algo bonito sienta bien.
writing.name=Escritura
writing.desc=Los pensamientos ya pueden sobrevivir a quien los piensa. Las historias viajan más lejos que nunca.
comfortfood.name=Comida reconfortante
comfortfood.desc=El azúcar y la grasa alivian un mal día. El cerebro recuerda exactamente qué ayudó.
lotteries.name=Loterías
lotteries.desc=Una probabilidad diminuta de un premio enorme. Lo que la gente compra de verdad es el sueño.
sportsbetting.name=Apuestas deportivas
sportsbetting.desc=Cada partido se convierte en una apuesta. Saber de deporte parece una ventaja, pero la casa siempre gana.
relapse.name=Recaída
relapse.desc=Un detonante y el viejo camino se ilumina de nuevo. La recuperación casi nunca es una línea recta.
coins.name=Monedas
coins.desc=Metal brillante que puedes cambiar por cualquier cosa. La recompensa detrás de todas las recompensas.
banks.name=Bancos
banks.desc=Tu dinero crece mientras duermes. El primer juego idle.
credit.name=Crédito
credit.desc=Tenlo ahora, págalo después. El futuro se gasta hoy.
stockmarket.name=Bolsa
stockmarket.desc=Los precios suben y bajan todo el día. Hay quien no puede dejar de mirar.
drugs.name=Drogas
drugs.desc=Sustancias que secuestran directamente el sistema de recompensa. Sin ningún esfuerzo.
nicotine.name=Nicotina
nicotine.desc=Llega al cerebro segundos después de una calada. Una de las sustancias más adictivas que se conocen.
cocaine.name=Cocaína
cocaine.desc=Impide que la dopamina se retire. El subidón es grande; el bajón, mayor.
amphetamines.name=Anfetaminas
amphetamines.desc=Expulsan oleadas de dopamina de las células. Velocidad y concentración, y luego agotamiento.
opioidcrisis.name=Crisis de los opioides
opioidcrisis.desc=Los analgésicos con receta se vendieron como seguros. Se perdieron cientos de miles de vidas.
smartphone.name=Smartphone
smartphone.desc=Todo internet en tu bolsillo, siempre a mano.
touchscreen.name=Pantalla táctil
touchscreen.desc=Desliza, toca, tira para actualizar. Los gestos están hechos para sentirse bien.
apps.name=Tiendas de apps
apps.desc=Millones de apps luchan por un hueco en tu pantalla de inicio.
alwayson.name=Siempre conectado
alwayson.desc=Nunca hay un momento sin pantalla. El aburrimiento casi desaparece.
phantom.name=Vibraciones fantasma
phantom.desc=Notas que el móvil vibra, pero no ha vibrado. Tu cerebro lo está esperando.
binge.name=Maratones de series
binge.desc=El siguiente episodio empieza en 5 segundos. Y luego el siguiente.
shopping.name=Compras con un clic
shopping.desc=La recompensa es comprar, no tener. El paquete es casi lo de menos.
influencers.name=Influencers
influencers.desc=Vidas perfectas, con filtro y patrocinadas. La comparación siempre está a un deslizamiento.
dating.name=Apps de citas
dating.desc=Desliza a la derecha. El amor convertido en juego.
gamification.name=Gamificación
gamification.desc=Puntos, insignias y niveles se añaden a todo, hasta a lavarse los dientes.
streaks.name=Rachas
streaks.desc=¡No rompas la cadena! Perder duele más de lo que ganar alegra.
leaderboards.name=Clasificaciones
leaderboards.desc=Siempre hay alguien por encima de ti. Sigue subiendo.
recovery.name=Recuperación
recovery.desc=Liberarse es posible. El cerebro puede sanar.
mindfulness.name=Atención plena
mindfulness.desc=Observa el ansia sin obedecerla. El impulso sube y luego se desvanece.
exercise.name=Ejercicio
exercise.desc=Mover el cuerpo mejora el ánimo y da al sistema de recompensa un entrenamiento sano.
sleep.name=Sueño
sleep.desc=Descansar reinicia el sistema de recompensa. Los cerebros cansados ansían más.
nature.name=Naturaleza
nature.desc=Un paseo al aire libre, sin notificaciones. Las recompensas lentas también son recompensas.
connection.name=Conexión real
connection.desc=Lo contrario de la adicción es la conexión. Llama a alguien a quien quieras.
transporter.name=Transportador de dopamina
transporter.desc=Una bomba llamada DAT recicla la dopamina. Muchas drogas atacan justo esa bomba.
receptortypes.name=Cinco receptores
receptortypes.desc=Del D1 al D5: cinco tipos de anclajes que permiten a una molécula hacer muchos trabajos.
basalganglia.name=Ganglios basales
basalganglia.desc=Un circuito de zonas cerebrales que decide qué acción gana.
toomuch.name=Demasiada dopamina
toomuch.desc=La dopamina hiperactiva puede hacer que cosas al azar parezcan profundamente significativas. Influye en la psicosis.
loneliness.name=Soledad
loneliness.desc=La soledad prolongada es casi tan mala para la salud como fumar.
friendship.name=Amistad
friendship.desc=Unos pocos amigos cercanos protegen tu mente mejor que casi cualquier otra cosa.
darkpatterns.name=Patrones oscuros
darkpatterns.desc=Botones de baja escondidos, temporizadores falsos, mensajes que te hacen sentir culpable. Diseño que te engaña.
humanetech.name=Tecnología humana
humanetech.desc=Algunos diseñadores intentan crear apps que respeten tu tiempo. Es un comienzo.

autopilot.name=Piloto automático
autopilot.desc=Tu cerebro sigue queriendo aunque no estés aquí. Mientras el juego está cerrado, ganas una parte de tus ingresos.
anticipation.name=Anticipación
anticipation.desc=Pensar en la recompensa también libera dopamina. Solo saber que el juego te espera ya sienta bien.
cuememory.name=Memoria de señales
cuememory.desc=Un sonido, un logo, una hora del día. Pequeños recordatorios devuelven tu mente aquí.
intrusive.name=Pensamientos intrusivos
intrusive.desc=Estás haciendo otra cosa, pero una parte de ti sigue contando números.
daydream.name=Soñar despierto
daydream.desc=Cuando las cosas se ponen aburridas, tu mente vuelve al árbol.
rumination.name=Rumiación
rumination.desc=Darle vueltas a los mismos pensamientos una y otra vez, mucho después de dejar de jugar.
obsession.name=Obsesión
obsession.desc=Está en tu cabeza desde que te despiertas hasta que te duermes. Así es exactamente como te atrapan los hábitos.
